name: Update recent activity

on:
  # Runs twice a day at 00:17 and 12:17 UTC (04:17 and 16:17 Dubai time).
  # GitHub may delay scheduled runs by minutes to hours under load.
  # Can also be triggered manually from the Actions tab (workflow_dispatch).
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Update public GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_activity.py

      - name: Commit activity changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Activity is already current."
          else
            git commit -m "chore: update recent GitHub activity"
            git push
          fi
