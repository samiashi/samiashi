name: Update recent activity

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-metrics.yml"
      - ".github/recent-activity.config.yml"
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: true

jobs:
  activity:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Update public GitHub activity
        uses: Readme-Workflows/recent-activity@2750d2b82f226b7327039aa8c3ff96748396ef80
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
